[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-agent-trace-attestor"
version = "0.1.0"
description = "Cryptographic Merkle tree audit attestor producing verifiable non-repudiation proofs for autonomous agent audit logs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
verifiable-agent-trace-attestor = "verifiable_agent_trace_attestor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verifiable_agent_trace_attestor*"]
